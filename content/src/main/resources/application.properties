spring.application.name=content

server.port=8080

grpc.client.meta-service.address=${GRPC_CLIENT_META_SERVICE_ADDRESS:static://meta:9090}
grpc.client.meta-service.negotiationType=${GRPC_CLIENT_META_SERVICE_NEGOTIATIONTYPE:plaintext}

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
spring.kafka.consumer.group-id=content-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

minio.endpoint=${MINIO_ENDPOINT:http://minio:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket-name=films

video.qualities=${VIDEO_QUALITIES:360p,480p,720p,1080p}
video.ffmpeg.path=${FFMPEG_PATH:}

jwt.secret=${JWT_SECRET:defaultSecretKeyForJWTTokenGenerationThatShouldBeAtLeast256BitsLongForSecurityPurposes}
