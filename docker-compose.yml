services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - movies-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-auth:
    image: postgres:16-alpine
    container_name: postgres-auth
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    networks:
      - movies-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U auth_user" ]
      interval: 5s
      timeout: 5s
      retries: 20

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - movies-network
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 2181" ]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_MESSAGE_MAX_BYTES: 52428800
      KAFKA_REPLICA_FETCH_MAX_BYTES: 52428800
      KAFKA_FETCH_MESSAGE_MAX_BYTES: 52428800
    networks:
      - movies-network
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092" ]
      interval: 5s
      timeout: 5s
      retries: 20

  meta:
    build:
      context: ./meta
      dockerfile: Dockerfile
    container_name: meta
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      GRPC_SERVER_PORT: 9090
      SERVER_PORT: 8080
      JWT_SECRET: defaultSecretKeyForJWTTokenGenerationThatShouldBeAtLeast256BitsLongForSecurityPurposes
    networks:
      - movies-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/health" ]
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: auth
    depends_on:
      postgres-auth:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/auth_db
      SPRING_DATASOURCE_USERNAME: auth_user
      SPRING_DATASOURCE_PASSWORD: auth_password
      SERVER_PORT: 8084
      JWT_SECRET: defaultSecretKeyForJWTTokenGenerationThatShouldBeAtLeast256BitsLongForSecurityPurposes
    networks:
      - movies-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8084/health" ]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - movies-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 5s
      retries: 20

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: admin
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      GRPC_CLIENT_META_SERVICE_ADDRESS: static://meta:9090
      GRPC_CLIENT_META_SERVICE_NEGOTIATIONTYPE: plaintext
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      JWT_SECRET: defaultSecretKeyForJWTTokenGenerationThatShouldBeAtLeast256BitsLongForSecurityPurposes
    networks:
      - movies-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/health" ]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - movies-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080" ]
      interval: 5s
      timeout: 5s
      retries: 20

  content:
    build:
      context: ./content
      dockerfile: Dockerfile
    container_name: content
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8083:8080"
    environment:
      GRPC_CLIENT_META_SERVICE_ADDRESS: static://meta:9090
      GRPC_CLIENT_META_SERVICE_NEGOTIATIONTYPE: plaintext
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      JWT_SECRET: defaultSecretKeyForJWTTokenGenerationThatShouldBeAtLeast256BitsLongForSecurityPurposes
    networks:
      - movies-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/health" ]
      interval: 5s
      timeout: 5s
      retries: 20

  user-frontend:
    build:
      context: ./user-frontend
      dockerfile: Dockerfile
    container_name: user-frontend
    networks:
      - movies-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1:3000" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  admin-frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
    container_name: admin-frontend
    networks:
      - movies-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/admin" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: nginx
    depends_on:
      user-frontend:
        condition: service_healthy
      admin-frontend:
        condition: service_healthy
      meta:
        condition: service_healthy
      auth:
        condition: service_healthy
      content:
        condition: service_healthy
      admin:
        condition: service_healthy
    ports:
      - "3000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - movies-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
  postgres_auth_data:
  minio_data:


networks:
  movies-network:
    driver: bridge
